<style>
  :root{
    --bg:#f4f1e7;--bg-soft:#ece7d8;--bg-card:#fffdf6;
    --green:#1f5e30;--green-mid:#2f7d44;--green-soft:#5a9c6c;

  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh;}

  body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 55% 45% at 84% 0%,rgba(31,94,48,.07),transparent 60%),radial-gradient(ellipse 50% 40% at 4% 96%,rgba(169,134,60,.08),transparent 60%);pointer-events:none;z-index:0;}

  .wrap{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;}

  /* top bar (header/nav/brand) — уніфікований каркас у worker.js (SHELL_CSS) */
  .back:hover{color:var(--green);}

  /* quiz layout */
  .quiz{flex:1;display:flex;align-items:center;justify-content:center;padding:30px 24px 60px;}
  .card{width:100%;max-width:660px;background:var(--bg-card);border:1px solid var(--line);border-radius:3px;padding:54px 52px;box-shadow:0 24px 60px -30px rgba(31,94,48,.28);transition:opacity .18s ease, transform .18s ease;}
  .card.fade{opacity:0;transform:translateY(8px);}

  .eyebrow{font-family:var(--sans);font-weight:400;font-size:.7rem;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);display:inline-block;margin-bottom:18px;}
  .eyebrow::before{content:"";display:inline-block;width:30px;height:1px;background:var(--gold);vertical-align:middle;margin-right:12px;opacity:.8;}

  h1{font-family:var(--serif);font-weight:500;line-height:1.1;letter-spacing:.01em;color:var(--green);font-size:clamp(2rem,5vw,2.9rem);}
  h2{font-family:var(--serif);font-weight:500;line-height:1.16;letter-spacing:.01em;color:var(--green);font-size:clamp(1.55rem,3.6vw,2.05rem);}
  em{font-style:italic;color:var(--gold);}
  .lead{color:var(--muted);font-size:1.02rem;margin-top:18px;max-width:46ch;}

  /* intro */
  .intro-note{font-size:.78rem;letter-spacing:.06em;color:var(--muted);margin-top:26px;}
  .intro-note b{color:var(--green);font-weight:500;}

  /* buttons */
  .btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--sans);font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;font-weight:400;padding:15px 34px;border-radius:2px;cursor:pointer;border:1px solid var(--green);background:var(--green);color:#fff;transition:.4s ease;text-decoration:none;}
  .btn:hover{background:var(--green-mid);border-color:var(--green-mid);transform:translateY(-2px);box-shadow:0 12px 26px -14px rgba(31,94,48,.6);}
  .btn-ghost{background:transparent;color:var(--green);}
  .btn-ghost:hover{background:var(--green);color:#fff;}
  .btn-row{margin-top:34px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;}

  /* progress */
  .progress-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .progress-label{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:400;}
  .progress-back{background:none;border:none;color:var(--muted);font-family:var(--sans);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:.3s;padding:2px 0;}
  .progress-back:hover{color:var(--green);}
  .bar{height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:34px;}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));border-radius:2px;transition:width .45s cubic-bezier(.4,0,.2,1);}

  /* question + answers */
  .q-title{margin-bottom:30px;}
  .answers{display:flex;flex-direction:column;gap:13px;}
  .answer{position:relative;text-align:left;background:#fff;border:1px solid var(--line);border-radius:3px;padding:18px 22px;font-family:var(--sans);font-size:1.01rem;font-weight:300;color:var(--ink);cursor:pointer;transition:.28s ease;line-height:1.45;}
  .answer:hover{border-color:var(--gold);transform:translateX(4px);box-shadow:0 10px 24px -16px rgba(169,134,60,.6);}
  .answer.sel{border-color:var(--green);background:rgba(31,94,48,.05);}
  .answer::after{content:"›";position:absolute;right:20px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:1.4rem;opacity:0;transition:.28s;}
  .answer:hover::after{opacity:1;right:16px;}

  /* result */
  .res-service{font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:400;margin-bottom:6px;}
  .res-price{display:inline-block;margin-top:18px;font-family:var(--serif);font-size:1.5rem;font-weight:600;color:var(--green);border:1px solid var(--line-gold);border-radius:2px;padding:6px 18px;background:rgba(169,134,60,.07);}
  .res-desc{color:var(--ink);font-size:1.05rem;margin-top:24px;line-height:1.75;}
  .consult{margin-top:26px;padding:20px 22px;background:rgba(31,94,48,.05);border-left:3px solid var(--green);border-radius:2px;}
  .consult b{color:var(--green);font-weight:500;}
  .consult p{color:var(--ink);font-size:.96rem;margin:0;}
  .res-links{margin-top:30px;padding-top:24px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:22px;align-items:center;}
  .res-links a, .res-links button{background:none;border:none;color:var(--muted);font-family:var(--sans);font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:.3s;display:inline-flex;align-items:center;gap:7px;}
  .res-links a:hover, .res-links button:hover{color:var(--green);}

    .card{padding:38px 26px;}
    .quiz{padding:18px 16px 44px;}
    .res-links{gap:16px;}
  }
